<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>曹杨二中 · 楼层平面模型</title>
<style>
  :root {
    --bg: #14161a; --panel: #1d2026; --panel2: #242830; --border: #333945;
    --text: #d8dce4; --dim: #8b93a3; --accent: #4f9cf9; --sel: #ffb02e;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font: 13px/1.5 "Segoe UI", "Microsoft YaHei", sans-serif; background: var(--bg); color: var(--text); height: 100vh; display: flex; overflow: hidden; }

  /* ===== 侧栏 ===== */
  #sidebar { width: 285px; min-width: 285px; background: var(--panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
  #sidebar h1 { font-size: 15px; padding: 12px 14px 4px; }
  #sidebar .sub { color: var(--dim); font-size: 11px; padding: 0 14px 10px; border-bottom: 1px solid var(--border); }
  #bldList { padding: 8px; display: flex; flex-direction: column; gap: 4px; }
  .bldBtn { text-align: left; padding: 7px 10px; border-radius: 7px; border: 1px solid transparent; background: none; color: var(--text); cursor: pointer; font-size: 13px; display: flex; justify-content: space-between; align-items: center; }
  .bldBtn:hover { background: var(--panel2); }
  .bldBtn.active { background: #2a364a; border-color: var(--accent); }
  .bldBtn .cnt { color: var(--dim); font-size: 11px; }
  #floorBar { display: flex; flex-wrap: wrap; gap: 5px; padding: 10px 12px; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); }
  .flBtn { padding: 4px 10px; border-radius: 6px; border: 1px solid var(--border); background: var(--panel2); color: var(--text); cursor: pointer; font-size: 12px; }
  .flBtn:hover { border-color: var(--accent); }
  .flBtn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  #searchWrap { padding: 10px 12px; border-bottom: 1px solid var(--border); }
  #search { width: 100%; padding: 6px 9px; border-radius: 7px; border: 1px solid var(--border); background: var(--panel2); color: var(--text); outline: none; }
  #search:focus { border-color: var(--accent); }
  #roomList { flex: 1; overflow-y: auto; padding: 6px; }
  .roomItem { padding: 5px 9px; border-radius: 6px; cursor: pointer; display: flex; gap: 8px; align-items: center; font-size: 12.5px; }
  .roomItem:hover { background: var(--panel2); }
  .roomItem.sel { background: #3a3a22; outline: 1px solid var(--sel); }
  .dot { width: 10px; height: 10px; border-radius: 3px; flex: none; border: 1px solid rgba(255,255,255,.25); }
  .roomItem .rid { color: var(--dim); font-size: 10.5px; margin-left: auto; }
  #detail { border-top: 1px solid var(--border); padding: 10px 14px; min-height: 118px; max-height: 200px; overflow-y: auto; background: var(--panel); }
  #detail h3 { font-size: 13.5px; margin-bottom: 4px; }
  #detail .kv { color: var(--dim); font-size: 12px; margin: 1px 0; }
  #detail .kv b { color: var(--text); font-weight: 500; }
  #detail .note { margin-top: 5px; padding: 6px 8px; background: var(--panel2); border-radius: 6px; font-size: 12px; color: #c9cfd9; }
  .link { color: var(--accent); cursor: pointer; text-decoration: underline; }

  /* ===== 主区 ===== */
  #main { flex: 1; display: flex; flex-direction: column; position: relative; }
  #topbar { display: flex; align-items: center; gap: 14px; padding: 8px 16px; background: var(--panel); border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  #topbar .title { font-weight: 600; font-size: 14px; }
  #topbar .meta { color: var(--dim); font-size: 12px; }
  #topbar label { color: var(--dim); font-size: 12px; display: flex; align-items: center; gap: 4px; cursor: pointer; user-select: none; }
  #topbar input[type=range] { width: 90px; }
  #topbar input[type=checkbox] { accent-color: var(--accent); }
  #canvasWrap { flex: 1; position: relative; overflow: hidden; background: #0e1013; }
  svg { width: 100%; height: 100%; display: block; cursor: grab; }
  svg.dragging { cursor: grabbing; }
  #hint { position: absolute; left: 12px; bottom: 10px; color: #6c7484; font-size: 11px; pointer-events: none; }
  #tooltip { position: absolute; pointer-events: none; background: rgba(20,23,28,.94); border: 1px solid var(--border); border-radius: 7px; padding: 6px 10px; font-size: 12px; display: none; z-index: 10; max-width: 260px; }
  #tooltip .tt-name { font-weight: 600; }
  #tooltip .tt-sub { color: var(--dim); font-size: 11px; }

  /* 弹性配色 */
  .r-classroom { fill: #e8c56a; }
  .r-lab  { fill: #d9b35a; } .r-lecture { fill: #dcae54; }
  .r-music, .r-art { fill: #e39aa4; }
  .r-library, .r-reading { fill: #e8a3b4; } .r-auditorium { fill: #d98f9f; }
  .r-office, .r-meeting, .r-admin { fill: #8fb4d9; }
  .r-dorm { fill: #e8a06a; } .r-dorm_utility { fill: #d98f5e; }
  .r-dining { fill: #d97b6c; } .r-kitchen { fill: #c96a5e; }
  .r-gym { fill: #7fc98a; }
  .r-hall { fill: #b9bec7; } .r-corridor { fill: #a8adb6; }
  .r-stairs, .r-elevator { fill: #6a9fe8; }
  .r-entrance { fill: #74c4c0; }
  .r-toilet { fill: #e07a8b; }
  .r-storage { fill: #b09a7a; } .r-equipment { fill: #9c8874; }
  .r-parking { fill: #6d727c; } .r-circulation_helper { fill: #7d828c; }
  .r-courtyard { fill: #8fca9c; } .r-other { fill: #c5c0ae; }
  .room { stroke: #2a2d33; stroke-width: .8; }
  .room:hover, .room.hl { filter: brightness(1.15); stroke: #fff; stroke-width: 1.6; }
  .room.sel { stroke: var(--sel); stroke-width: 2.2; filter: brightness(1.1); }
  .room.dim { opacity: .18; }
  .room.linked { stroke: #6db3ff; stroke-width: 1.8; stroke-dasharray: 5 3; cursor: pointer; }
  .room.linked:hover { filter: brightness(1.2); stroke-width: 2.6; }
  .lbl { font-size: 9.5px; fill: #1c1e22; paint-order: stroke; stroke: rgba(255,255,255,.55); stroke-width: .6; pointer-events: none; text-anchor: middle; user-select: none; }
  .lbl.big { font-size: 12px; }
  .lbl.onDark { fill: #f2f4f8; stroke: rgba(0,0,0,.6); }
  .outline { fill: none; stroke: #565d6a; stroke-width: 1.4; }
  .gridln { stroke: #4f9cf955; stroke-width: .7; stroke-dasharray: 5 4; }
  .gridlb { font-size: 9px; fill: #4f9cf9; text-anchor: middle; }
  .open { fill: #ff8c2e; }
  .open.line { stroke: #ff8c2e; stroke-width: 2.4; }
  .open.selrel { fill: #ffd23e; }
  .axis { stroke: #ff5d5d88; stroke-width: .6; }
</style>
</head>

const TYPE_CN = {classroom:"教室",lab:"实验室",lecture:"阶梯教室",music:"音乐",art:"美术艺术",
  library:"图书",reading:"阅览",auditorium:"礼堂",office:"办公",meeting:"会议",admin:"行政",
  dorm:"宿舍","dorm-utility":"宿舍配套",dining:"餐厅",kitchen:"厨房",gym:"体育馆",hall:"门厅/中庭",
  corridor:"走廊",stairs:"楼梯",elevator:"电梯",entrance:"入口",toilet:"卫生间",storage:"储藏",
  equipment:"设备",parking:"车位",circulation_helper:"车道",courtyard:"庭院",other:"其他"};

const CONF_CN = {high:"高", medium:"中", low:"低"};

function floorsOf(b){ return MODEL.buildings[b].floors; }
function curData(){ return floorsOf(curB)[curF]; }

/* ---------- 侧栏：楼栋列表 ---------- */
function renderBldList() {
  const el = document.getElementById('bldList');
  el.innerHTML = '';
  MODEL.buildings.forEach((b, i) => {
    const btn = document.createElement('button');
    btn.className = 'bldBtn' + (i === curB ? ' active' : '');
    const rc = b.floors.reduce((s, f) => s + f.rooms.length, 0);
    btn.innerHTML = `<span>${b.building}</span><span class="cnt">${b.floors.length}层 · ${rc}间</span>`;
    btn.onclick = () => { curB = i; curF = 0; selId = null; refreshAll(); };
    el.appendChild(btn);
  });
}

/* ---------- 侧栏：楼层条 ---------- */
function renderFloorBar() {
  const el = document.getElementById('floorBar');
  el.innerHTML = '';
  floorsOf(curB).forEach((f, i) => {
    const btn = document.createElement('button');
    btn.className = 'flBtn' + (i === curF ? ' active' : '');
    btn.textContent = f.levels.length > 1 ? f.levels[0] + '-' + f.levels[f.levels.length-1] + 'F' : f.id;
    btn.title = f.id;
    btn.onclick = () => { curF = i; selId = null; refreshAll(); };
    el.appendChild(btn);
  });
}

/* ---------- 侧栏：房间列表 ---------- */
function renderRoomList(filter) {
  const el = document.getElementById('roomList');
  el.innerHTML = '';
  const f = curData();
  let rooms = f.rooms;
  if (filter) {
    const q = filter.toLowerCase();
    rooms = rooms.filter(r => r.name.toLowerCase().includes(q) || r.id.toLowerCase().includes(q) || (TYPE_CN[r.type]||'').includes(q));
  }
  rooms.forEach(r => {
    const div = document.createElement('div');
    div.className = 'roomItem' + (r.id === selId ? ' sel' : '');
    const typeCls = 'r-' + r.type.replace('-', '_');
    div.innerHTML = `<span class="dot ${typeCls}" style="border-radius:50%"></span><span>${esc(r.name)}</span><span class="rid">${esc(r.id.split('-').slice(-1)[0])}</span>`;
    div.onclick = () => selectRoom(r.id, true);
    el.appendChild(div);
  });
  if (!rooms.length) el.innerHTML = '<div class="kv" style="color:var(--dim);padding:8px">无匹配房间</div>';
}

function floorScale() {
  const f = curData(), b = MODEL.buildings[curB];
  return f.metersPerPixel !== undefined ? f.metersPerPixel : b.coordinateSystem.metersPerPixel;
}

/* ---------- 详情面板 ---------- */
function showDetail(r) {
  const el = document.getElementById('detail');
  if (!r) { el.innerHTML = '<div class="kv">点击房间查看详情；滚轮缩放，拖拽平移。</div>'; return; }
  const f = curData(), b = MODEL.buildings[curB];
  const s = floorScale();
  const areaPx = polyArea(r.polygon);
  const areaM2 = s ? areaPx * s * s : null;
  let rel = relatedOf(r.id);
  let html = `<h3>${esc(r.name)} <span style="color:var(--dim);font-weight:400">· ${TYPE_CN[r.type]||r.type}</span></h3>`
    + `<div class="kv">编号 <b>${esc(r.id)}</b> · 面积 <b>${areaM2 ? areaM2.toFixed(0)+' m²' : areaPx.toFixed(0)+' px²'}</b> · 可信度 <b>${CONF_CN[r.confidence]||r.confidence||'—'}</b></div>`;
  if (rel.doors.length) html += `<div class="kv">连通：${rel.doors.map(x => `<span class="link" onclick="selectRoom('${esc(x.roomId)}',true)">${esc(x.roomName)}</span>`).join('、')}</div>`;
  if (rel.verts.length) html += `<div class="kv">垂直交通：${rel.verts.map(v => `${v.kind==='stairs'?'楼梯':'电梯'} → ${v.connects.join('/')}`).map(x => `<b>${esc(x)}</b>`).join('；')}</div>`;
  if (r.note) html += `<div class="note">${esc(r.note)}</div>`;
  el.innerHTML = html;
}

function relatedOf(rid) {
  const f = curData();
  const doors = [];
  f.openings.forEach(o => {
    if (o.between[0] === rid && o.between[1] !== 'outside') doors.push({roomId:o.between[1], roomName:nameOf(o.between[1])});
    else if (o.between[1] === rid && o.between[0] !== 'outside') doors.push({roomId:o.between[0], roomName:nameOf(o.between[0])});
  });
  const verts = (f.vertical||[]).filter(v => v.roomId === rid);
  return {doors, verts};
}
function nameOf(rid) { const r = curData().rooms.find(x => x.id === rid); return r ? r.name : rid; }

/* ---------- SVG 渲染 ---------- */
function polyArea(p) { let s=0; for(let i=0;i<p.length;i++){const [x1,y1]=p[i],[x2,y2]=p[(i+1)%p.length]; s+=x1*y2-x2*y1;} return Math.abs(s)/2; }
function centroid(p) { let x=0,y=0; p.forEach(q=>{x+=q[0];y+=q[1];}); return [x/p.length, y/p.length]; }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

function render() {
  const f = curData(), b = MODEL.buildings[curB];
  const imgPath = f.sourceImageFull || (b.coordinateSystem.sourceDirRel + '/' + f.sourceImage);
  // 手绘等大尺寸来源：显示元素（标签/描边/门口点）按底图高度相对 873 缩放
  const scl = f.imageSize ? f.imageSize[1] / 873 : 1;
  const bb = contentBBox(f);
  const x0 = bb.x, y0 = bb.y, x1 = bb.x + bb.w, y1 = bb.y + bb.h;
  applyVB();

  let g = '';
  // 原图底图（数据坐标即原图像素坐标，故底图原点为 0,0）
  const iw = (f.imageSize ? f.imageSize[0] : 1164), ih = (f.imageSize ? f.imageSize[1] : 873);
  g += `<image id="bgImg" href="${encodeURI(imgPath)}" x="0" y="0" width="${iw}" height="${ih}" opacity="${document.getElementById('imgOp').value/100}" style="display:${document.getElementById('ckImg').checked?'':'none'};image-rendering:pixelated"/>`;

  // 轴网
  if (document.getElementById('ckGrid').checked) {
    g += '<g id="gridG">';
    (f.grid?.vertical||[]).forEach(a => { g += `<line class="gridln" x1="${a.x}" y1="${y0}" x2="${a.x}" y2="${y1}"/><text class="gridlb" x="${a.x}" y="${y0+10}">${esc(a.label)}</text>`; });
    (f.grid?.horizontal||[]).forEach(a => { g += `<line class="gridln" x1="${x0}" y1="${a.y}" x2="${x1}" y2="${a.y}"/><text class="gridlb" x="${x0+12}" y="${a.y+3}">${esc(a.label)}</text>`; });
    g += '</g>';
  }

  // 房间
  const relIds = selId ? new Set([selId, ...f.openings.filter(o=>o.between.includes(selId)).flatMap(o=>o.between)]) : null;
  g += '<g id="roomsG">';
  f.rooms.forEach(r => {
    const pts = r.polygon.map(p=>p.join(',')).join(' ');
    const cls = `room r-${r.type.replace('-','_')}` + (r.id===selId?' sel':'') + (r.linkTo?' linked':'') + (relIds&&!relIds.has(r.id)?' dim':'');
    const sw = r.id===selId ? 2.2*scl : (r.linkTo ? 1.8*scl : 0.8*scl);
    g += `<polygon id="${esc(r.id)}" class="${cls}" points="${pts}" style="stroke-width:${sw}"><title>${esc(r.name)}｜${esc(r.id)}${r.linkTo?'（点击跳转 '+r.linkTo+'）':''}</title></polygon>`;
  });
  g += '</g>';

  // 外轮廓
  if (f.outline) {
    g += `<polygon class="outline" points="${f.outline.polygon.map(p=>p.join(',')).join(' ')}" style="stroke-width:${1.4*scl}"/>`;
  }

  // 名称标签
  if (document.getElementById('ckLbl').checked) {
    g += '<g id="lblG">';
    f.rooms.forEach(r => {
      const area = polyArea(r.polygon);
      if (area < 380 * scl * scl) return;
      const [cx, cy] = centroid(r.polygon);
      const dark = ['parking','circulation-helper','stairs','elevator','equipment'].includes(r.type);
      const big = area > 8000 * scl * scl;
      g += `<text class="lbl${big?' big':''}${dark?' onDark':''}" x="${cx}" y="${cy+3}" style="font-size:${(big?12:9.5)*scl}px">${esc(r.name)}</text>`;
    });
    g += '</g>';
  }

  // 门口
  if (document.getElementById('ckOpen').checked) {
    g += '<g id="openG">';
    f.openings.forEach(o => {
      if (!o.at) return;
      const isSelRel = selId && o.between.includes(selId);
      const cls = 'open' + (isSelRel ? ' selrel' : '');
      g += `<circle class="${cls}" cx="${o.at[0]}" cy="${o.at[1]}" r="${(isSelRel?3.4:2.2)*scl}"><title>${esc(o.between.map(id=>id==='outside'?'室外':nameOf(id)).join(' ↔ '))}</title></circle>`;
    });
    g += '</g>';
  }

  // 楼梯电梯标注
  if (document.getElementById('ckVert').checked) {
    (f.vertical||[]).forEach(v => {
      const r = f.rooms.find(x=>x.id===v.roomId);
      if (!r) return;
      const [cx,cy] = centroid(r.polygon);
      g += `<text class="lbl onDark" x="${cx}" y="${cy-6*scl}" style="font-size:${8.5*scl}px">${v.kind==='stairs'?'🪜':'🛗'}${esc(v.connects.join('~'))}</text>`;
    });
  }

  svg.innerHTML = g;
  bindRoomEvents();
  // 恢复缩放记忆（同层切换时）
}

function contentBBox(f) {
  let xs=[], ys=[];
  (f.outline?f.outline.polygon:[]).forEach(p=>{xs.push(p[0]);ys.push(p[1]);});
  f.rooms.forEach(r=>r.polygon.forEach(p=>{xs.push(p[0]);ys.push(p[1]);}));
  if (!xs.length){ xs=[0,1164]; ys=[0,873]; }
  const pad = 30;
  const x0 = Math.min(...xs)-pad, y0 = Math.min(...ys)-pad;
  const x1 = Math.max(...xs)+pad, y1 = Math.max(...ys)+pad;
  return {x:x0, y:y0, w:x1-x0, h:y1-y0};
}

function fitVB() {
  const wrap = document.getElementById('canvasWrap');
  const aw = wrap.clientWidth / wrap.clientHeight;
  if (vb.w / vb.h > aw) { vb.h2 = vb.w / aw; vb.y -= (vb.h2 - vb.h)/2; vb.h = vb.h2; }
  else { const nw = vb.h * aw; vb.x -= (nw - vb.w)/2; vb.w = nw; }
  applyVB();
}
function applyVB() { svg.setAttribute('viewBox', `${vb.x} ${vb.y} ${vb.w} ${vb.h}`); }

function bindRoomEvents() {
  const tip = document.getElementById('tooltip');
  svg.querySelectorAll('polygon.room').forEach(el => {
    el.addEventListener('mousemove', e => {
      const r = curData().rooms.find(x=>x.id===el.id);
      if (!r) return;
      tip.style.display = 'block';
      const rect = document.getElementById('canvasWrap').getBoundingClientRect();
      tip.style.left = Math.min(e.clientX - rect.left + 14, rect.width - 270) + 'px';
      tip.style.top = (e.clientY - rect.top + 14) + 'px';
      tip.innerHTML = `<div class="tt-name">${esc(r.name)}</div><div class="tt-sub">${esc(r.id)} · ${TYPE_CN[r.type]||r.type}${r.note?' · '+esc(r.note.slice(0,40)):''}</div>`;
    });
    el.addEventListener('mouseleave', () => tip.style.display = 'none');
    el.addEventListener('click', e => {
      e.stopPropagation();
      const r = curData().rooms.find(x=>x.id===el.id);
      if (r && r.linkTo) { jumpToBuilding(r.linkTo); return; }
      selectRoom(el.id, false);
    });
  });
}

function selectRoom(rid, center) {
  selId = rid;
  render(); renderRoomList(document.getElementById('search').value.trim());
  const r = curData().rooms.find(x=>x.id===rid);
  showDetail(r);
  if (center && r) {
    const [cx, cy] = centroid(r.polygon);
    vb.x = cx - vb.w/2; vb.y = cy - vb.h/2; applyVB();
  }
}

function jumpToBuilding(name) {
  const i = MODEL.buildings.findIndex(b => b.building === name);
  if (i < 0) return;
  curB = i; curF = 0; selId = null;
  refreshAll();
}
window.jumpToBuilding = jumpToBuilding;

/* ---------- 缩放/平移 ---------- */
svg.addEventListener('wheel', e => {
  e.preventDefault();
  const rect = svg.getBoundingClientRect();
  const mx = vb.x + (e.clientX-rect.left)/rect.width*vb.w;
  const my = vb.y + (e.clientY-rect.top)/rect.height*vb.h;
  const k = e.deltaY > 0 ? 1.15 : 1/1.15;
  const w = Math.min(Math.max(vb.w*k, 60), 4000);
  const h = w * rect.height/rect.width;
  vb.x = mx - (mx-vb.x)*w/vb.w; vb.y = my - (my-vb.y)*h/vb.h;
  vb.w = w; vb.h = h; applyVB();
}, {passive:false});

let drag = null;
svg.addEventListener('mousedown', e => { drag = {x:e.clientX, y:e.clientY, vx:vb.x, vy:vb.y}; svg.classList.add('dragging'); });
window.addEventListener('mousemove', e => {
  if (!drag) return;
  const rect = svg.getBoundingClientRect();
  vb.x = drag.vx - (e.clientX-drag.x)/rect.width*vb.w;
  vb.y = drag.vy - (e.clientY-drag.y)/rect.height*vb.h;
  applyVB();
});
window.addEventListener('mouseup', () => { drag = null; svg.classList.remove('dragging'); });
svg.addEventListener('click', e => { if (e.target === svg) { selId = null; render(); renderRoomList(document.getElementById('search').value.trim()); showDetail(null); } });

/* ---------- 顶栏 ---------- */
function renderTopbar() {
  const f = curData(), b = MODEL.buildings[curB];
  document.getElementById('tbTitle').textContent = b.isCampus ? (b.building + '（点击蓝色虚线楼栋可跳转楼层）') : (b.building + ' · ' + f.id);
  const s = floorScale();
  const areaM2 = (f.outline && s) ? polyArea(f.outline.polygon) * s * s : null;
  document.getElementById('tbMeta').textContent =
    `${f.rooms.length}个房间 · ${f.openings.length}个门洞` + (areaM2 ? ` · 外轮廓约${areaM2.toFixed(0)} m²` : '');
  document.getElementById('tbScale').textContent = s ? `比例 ≈ 1px = ${s.toFixed(3)} m` : '本层比例未标定';
}

/* ---------- 刷新 ---------- */
function refreshAll() {
  renderBldList(); renderFloorBar(); renderTopbar();
  vb = contentBBox(curData()); fitVB();
  render(); renderRoomList(''); showDetail(null);
}

/* ---------- 搜索 ---------- */
document.getElementById('search').addEventListener('input', e => renderRoomList(e.target.value.trim()));

/* ---------- 控件 ---------- */
document.getElementById('ckImg').addEventListener('change', render);
document.getElementById('imgOp').addEventListener('input', () => { const im = document.getElementById('bgImg'); if (im) im.setAttribute('opacity', document.getElementById('imgOp').value/100); });
document.getElementById('ckLbl').addEventListener('change', render);
document.getElementById('ckGrid').addEventListener('change', render);
document.getElementById('ckOpen').addEventListener('change', render);
document.getElementById('ckVert').addEventListener('change', render);

window.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.key === 'ArrowLeft' && curF > 0) { curF--; selId=null; refreshAll(); }
  if (e.key === 'ArrowRight' && curF < floorsOf(curB).length-1) { curF++; selId=null; refreshAll(); }
});
window.selectRoom = selectRoom;

refreshAll();
</script>
</body>
</html>
